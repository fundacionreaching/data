<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de Población — Tolima · Fundación Reaching</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{ --bg:#0b1220;--card:#0f172a;--txt:#e5e7eb;--muted:#9ca3af;--line:#1f2937;--btn:#1d4ed8 }
    html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:var(--bg);color:var(--txt)}
    .wrap{max-width:1200px;margin:auto;padding:16px}
    h1{font-size:clamp(18px,2.4vw,24px);margin:0 0 2px;font-weight:800}
    .muted{color:var(--muted);font-size:13px}
    .card{background:linear-gradient(180deg,#0f172a,#0b1220);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:16px}
    .head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .btn{appearance:none;border:1px solid #0b3ea1;background:linear-gradient(180deg,#2563eb,#1d4ed8);color:white;padding:8px 12px;border-radius:12px;text-decoration:none;font-weight:700;cursor:pointer}
    .btn.secondary{background:transparent;border-color:#374151;color:#e5e7eb}
    .section{padding:12px 14px}
    .grid{display:grid;gap:10px}
    @media(min-width:900px){.grid.cols-3{grid-template-columns:repeat(3,1fr)}}
    .kpi{background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:10px}
    .kpi .lbl{font-size:12px;color:var(--muted)}
    .kpi .val{font-size:18px;font-weight:800}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border-bottom:1px solid #1f2937;padding:8px;text-align:left}
    th{color:#cbd5e1;font-weight:700}
    #map{width:100%;height:70vh;min-height:420px;border-radius:12px}
    .legend{background:white;color:#0b1220;padding:8px 10px;border-radius:10px;line-height:1.2;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    select{background:#0b1220;color:#e5e7eb;border:1px solid #374151;border-radius:10px;padding:8px}
    .debug{background:#0b1220;border-top:1px dashed #374151;padding:10px;border-radius:0 0 18px 18px;font-size:12px}
    .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700}
    .ok{background:#022c22;color:#22c55e;border:1px solid #065f46}
    .err{background:#3f1d20;color:#fca5a5;border:1px solid #7f1d1d}
    .warn{background:#3a2a00;color:#fbbf24;border:1px solid #92400e}
    code{background:#0b1220;border:1px solid #1f2937;border-radius:6px;padding:2px 6px}
  </style>
</head>
<body>
  <main class="wrap">
    <!-- === DATOS DANE === -->
    <section class="card" aria-label="Datos DANE — Población Tolima/Ibagué">
      <div class="head">
        <div>
          <h1>Datos de Población (DANE)</h1>
          <div class="muted">CSV en GitHub + Visualización interactiva</div>
        </div>
        <div class="actions">
          <label class="muted" for="selMunicipio">Municipio:</label>
          <select id="selMunicipio"></select>
          <label class="muted" for="selAnio">Año:</label>
          <select id="selAnio"></select>
          <button id="btnDiag" class="btn secondary" type="button">Diagnóstico</button>
          <button id="btnRefrescar" class="btn secondary" type="button">Refrescar</button>
          <a id="btnDescargar" class="btn" href="#" download>Descargar CSV</a>
        </div>
      </div>
      <div class="section">
        <div class="grid cols-3" style="margin-bottom:10px">
          <div class="kpi"><div class="lbl">Municipio</div><div class="val" id="kpiMuni">—</div></div>
          <div class="kpi"><div class="lbl">Año</div><div class="val" id="kpiAnio">—</div></div>
          <div class="kpi"><div class="lbl">Población</div><div class="val" id="kpiPoblacion">—</div></div>
        </div>
        <div style="overflow:auto">
          <table id="tabla"><thead><tr><th>Municipio</th><th>Año</th><th>Población</th></tr></thead><tbody></tbody></table>
        </div>
        <div id="msg" class="muted" style="margin-top:8px"></div>
        <div id="debugCsv" class="debug" hidden></div>
      </div>
    </section>

    <!-- === MAPA === -->
    <section class="card" aria-label="Mapa Poblacional Tolima">
      <div class="head">
        <div>
          <h1>Mapa Poblacional — Tolima</h1>
          <div class="muted">Municipios (Tolima) • Comunas y Corregimientos (Ibagué)</div>
        </div>
        <div class="actions">
          <label class="muted" for="selCapa">Capa:</label>
          <select id="selCapa">
            <option value="municipios">Municipios (Tolima)</option>
            <option value="comunas">Comunas (Ibagué)</option>
            <option value="corregimientos">Corregimientos (Ibagué)</option>
          </select>
          <span class="muted">Año usa el selector de arriba</span>
        </div>
      </div>
      <div class="section">
        <div id="map"></div>
        <div id="debugGeo" class="debug" hidden></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ====== RUTAS ROBUSTAS ======
    const bust = u => u + (u.includes('?') ? '&' : '?') + 'v=' + Date.now();
    const ROOT = p => location.origin + p;               // raíz del sitio
    const SAME = p => new URL(p, location.href).toString(); // relativo al HTML actual

    // Archivos permitidos sin carpeta "data/"
    const CSV_URLS = [
      SAME('dane_tolima_poblacion.csv'),     // mismo directorio que la página
      SAME('../dane_tolima_poblacion.csv'),  // si la página está en /data y el CSV en raíz
      ROOT('/dane_tolima_poblacion.csv'),    // raíz
      ROOT('/data/dane_tolima_poblacion.csv'), // carpeta data
      'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/dane_tolima_poblacion.csv',
      'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/data/dane_tolima_poblacion.csv',
      'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/dane_tolima_poblacion.csv',
      'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/data/dane_tolima_poblacion.csv',
      'https://raw.githubusercontent.com/fundacionreaching/data/main/dane_tolima_poblacion.csv',
      'https://raw.githubusercontent.com/fundacionreaching/data/main/data/dane_tolima_poblacion.csv'
    ];

    const RUTAS = {
      municipios: [
        SAME('tolima_municipios.geojson'),
        SAME('../tolima_municipios.geojson'),
        ROOT('/tolima_municipios.geojson'),
        ROOT('/data/tolima_municipios.geojson'),
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/tolima_municipios.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/data/tolima_municipios.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/tolima_municipios.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/data/tolima_municipios.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/data/main/tolima_municipios.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/data/main/data/tolima_municipios.geojson'
      ],
      comunas: [
        SAME('ibague_comunas.geojson'),
        SAME('../ibague_comunas.geojson'),
        ROOT('/ibague_comunas.geojson'),
        ROOT('/data/ibague_comunas.geojson'),
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/ibague_comunas.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/data/ibague_comunas.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/ibague_comunas.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/data/ibague_comunas.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/data/main/ibague_comunas.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/data/main/data/ibague_comunas.geojson'
      ],
      corregimientos: [
        SAME('ibague_corregimientos.geojson'),
        SAME('../ibague_corregimientos.geojson'),
        ROOT('/ibague_corregimientos.geojson'),
        ROOT('/data/ibague_corregimientos.geojson'),
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/ibague_corregimientos.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/index-html/data/ibague_corregimientos.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/ibague_corregimientos.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/fundacionreaching.github.io/main/data/ibague_corregimientos.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/data/main/ibague_corregimientos.geojson',
        'https://raw.githubusercontent.com/fundacionreaching/data/main/data/ibague_corregimientos.geojson'
      ]
    };

    // ====== UTIL ======
    const norm = s => (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
    async function fetchFirst(urls, as='json'){
      const list = Array.isArray(urls) ? urls : [urls];
      const out = [];
      for (const u0 of list){
        const u = bust(u0);
        try{
          const r = await fetch(u,{cache:'no-store'});
          out.push({url:u0, status:r.status});
          if(r.ok){ return {url:u0, body: (as==='json'? await r.json(): await r.text()), log:out}; }
        }catch(e){ out.push({url:u0, status:e.message}); }
      }
      return {url:null, body:null, log:out};
    }

    // ====== CSV ======
    async function fetchCSV(){
      const try1 = await fetchFirst(CSV_URLS, 'text');
      if(try1.body){ return try1; }
      throw new Error(JSON.stringify(try1.log));
    }
    function parseCSV(text){
      const lines = text.split(/\r?\n/).filter(Boolean);
      if(lines.length<2) return [];
      const cand = lines[0];
      const delim = (cand.split(';').length > cand.split(',').length) ? ';' : ',';
      const re = new RegExp(`([^"${delim}]+|"(?:[^"\\]|\\.|"")*"|(?<=${delim})(?=${delim})|^$)`, 'g');
      function splitRow(row){
        const m = row.match(re);
        const arr = (m && m.length) ? m : row.split(delim);
        return arr.map(s=>{ let v = s.trim(); if(v.startsWith('"') && v.endsWith('"')) v = v.slice(1,-1).replace(/""/g,'"'); return v; });
      }
      const headers = splitRow(lines[0]).map(h=>h.trim().toLowerCase());
      const idxM = headers.findIndex(h=>/(^|\b)(municipio|mpio|ciudad)(\b|$)/.test(h));
      const idxA = headers.findIndex(h=>/(^|\b)(año|anio|year)(\b|$)/.test(h));
      const idxP = headers.findIndex(h=>/(^|\b)(poblaci|pob_total|total)(\b|$)/.test(h));
      const out = [];
      for(let i=1;i<lines.length;i++){
        const cols = splitRow(lines[i]);
        const muni = (cols[idxM]||'').trim();
        const anio = Number((cols[idxA]||'').toString().trim());
        const pob  = Number((cols[idxP]||'').toString().replace(/\./g,'').replace(/\s/g,'').replace(/,/g,'').trim());
        if(muni && anio && !Number.isNaN(pob)) out.push({muni, anio, pob});
      }
      return out;
    }

    // ====== UI DANE ======
    const SELM = document.getElementById('selMunicipio');
    const SELA = document.getElementById('selAnio');
    const TBL = document.querySelector('#tabla tbody');
    const KPI_M = document.getElementById('kpiMuni');
    const KPI_A = document.getElementById('kpiAnio');
    const KPI_P = document.getElementById('kpiPoblacion');
    const MSG   = document.getElementById('msg');
    const DBGCSV= document.getElementById('debugCsv');

    let DANE=[], byYear=new Map(), YEARS=[];

    function indexDane(){
      byYear.clear();
      YEARS = Array.from(new Set(DANE.map(d=>d.anio))).sort((a,b)=>a-b);
      YEARS.forEach(a=>{ const map=new Map(); DANE.filter(d=>d.anio===a).forEach(d=>map.set(norm(d.muni), d.pob)); byYear.set(a,map); });
      const municipios = Array.from(new Set(DANE.map(d=>d.muni))).sort();
      SELM.innerHTML = municipios.map(m=>`<option>${m}</option>`).join('');
      SELA.innerHTML = YEARS.map(y=>`<option>${y}</option>`).join('');
      const ibg = municipios.find(m=>/ibague|ibagué/i.test(m)); if(ibg) SELM.value=ibg;
      SELA.value = YEARS[YEARS.length-1]||'';
    }

    function renderTabla(){
      const muni = SELM.value; const rows = DANE.filter(d=>d.muni===muni).sort((a,b)=>a.anio-b.anio);
      TBL.innerHTML = rows.map(r=>`<tr><td>${r.muni}</td><td>${r.anio}</td><td>${r.pob.toLocaleString('es-CO')}</td></tr>`).join('');
      const anio = Number(SELA.value);
      const sel = rows.find(r=>r.anio===anio);
      KPI_M.textContent = muni || '—';
      KPI_A.textContent = anio || '—';
      KPI_P.textContent = sel? sel.pob.toLocaleString('es-CO') : '—';
      document.dispatchEvent(new CustomEvent('dane:loaded'));
    }

    // ====== MAPA ======
    const map = L.map('map').setView([4.44,-75.24], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
    let layer=null, legend=null;

    function getScale(vals){
      if(!vals.length) return v=>'#d1d5db';
      vals = vals.slice().sort((a,b)=>a-b);
      const q = p=> vals[Math.floor(p*(vals.length-1))];
      const br=[q(0.1),q(0.3),q(0.5),q(0.7),q(0.9)];
      return v=>{
        if(v==null) return '#334155';
        if(v<=br[0]) return '#dbeafe'; if(v<=br[1]) return '#93c5fd'; if(v<=br[2]) return '#60a5fa'; if(v<=br[3]) return '#2563eb'; if(v<=br[4]) return '#1d4ed8'; return '#0b3ea1';
      }
    }
    function drawLegend(scale, vals){
      if(legend) legend.remove();
      legend=L.control({position:'bottomright'}); legend.onAdd=function(){ const d=L.DomUtil.create('div','legend'); const ss=[vals[0], vals[Math.floor(vals.length*0.25)]||vals[0], vals[Math.floor(vals.length*0.5)]||vals[0], vals[Math.floor(vals.length*0.75)]||vals[0], vals[vals.length-1]]; d.innerHTML='<b>Población</b><br>' + ss.map(v=>`<div style="display:flex;align-items:center;gap:8px;margin:2px 0"><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${scale(v)}"></span>${Number(v).toLocaleString('es-CO')}</div>`).join(''); return d; }; legend.addTo(map);
    }

    async function cargarCapa(tipo){
      const DBG = document.getElementById('debugGeo');
      try{
        const anio = Number(SELA.value);
        const byName = byYear.get(anio) || new Map();
        const nameKeys=['MUNICIPIO','NOMBRE','NOMBRE_COM','COMUNA','CORREGIM','name'];
        const probe = await fetchFirst(RUTAS[tipo], 'json');
        DBG.hidden=false; DBG.innerHTML = `<div><b>Rutas ${tipo}</b></div>` + probe.log.map(x=>`<div><code>${x.url}</code> → <span class="chip ${x.status===200?'ok':(x.status===404?'err':'warn')}">${x.status}</span></div>`).join('');
        if(!probe.body){ return; }
        const geo = probe.body;
        const vals=[];
        function pob(props){
          if(typeof props.poblacion==='number') return props.poblacion;
          const nom = norm(nameKeys.map(k=>props[k]).find(Boolean));
          const v = byName.get(nom);
          return (typeof v==='number') ? v : null;
        }
        if(layer) map.removeLayer(layer);
        layer = L.geoJSON(geo, { style: f=>({color:'#1f2937', weight:1, opacity:1, fillOpacity:.75, fillColor:'#334155'}), onEachFeature:(f,l)=>{ const p=f.properties||{}; const v=pob(p); const nom=p.MUNICIPIO||p.NOMBRE||p.NOMBRE_COM||p.COMUNA||p.CORREGIM||p.name||'—'; l.bindPopup(`<b>${nom}</b><br>Población ${anio}: ${v!=null? Number(v).toLocaleString('es-CO'):'Sin dato'}`); } }).addTo(map);
        layer.eachLayer(l=>{ const v=pob(l.feature.properties||{}); if(v!=null) vals.push(v); });
        const scale=getScale(vals);
        layer.setStyle(f=>{ const v=pob(f.properties||{}); return {color:'#1f2937', weight:1, opacity:1, fillOpacity:.8, fillColor: scale(v)}; });
        try{ map.fitBounds(layer.getBounds(), {padding:[12,12]}); }catch(_){ }
        drawLegend(scale, vals.length? vals.sort((a,b)=>a-b):[0,1]);
      }catch(e){ DBG.hidden=false; DBG.innerHTML = `<span class="chip err">Error capa</span> <code>${e.message||e}</code>`; }
    }

    // ====== BOOT ======
    (async()=>{
      document.getElementById('btnRefrescar').onclick = ()=> location.href = bust(location.href);
      document.getElementById('btnDiag').onclick = async ()=>{
        const p = await fetchFirst(CSV_URLS, 'text');
        const DBGCSV= document.getElementById('debugCsv');
        DBGCSV.hidden=false; DBGCSV.innerHTML = `<div><b>Rutas CSV</b></div>` + p.log.map(x=>`<div><code>${x.url}</code> → <span class="chip ${x.status===200?'ok':(x.status===404?'err':'warn')}">${x.status}</span></div>`).join('');
      };

      try{
        const probe = await fetchFirst(CSV_URLS, 'text');
        const DBGCSV= document.getElementById('debugCsv');
        DBGCSV.hidden=false; DBGCSV.innerHTML = `<div><b>Rutas CSV</b></div>` + probe.log.map(x=>`<div><code>${x.url}</code> → <span class="chip ${x.status===200?'ok':(x.status===404?'err':'warn')}">${x.status}</span></div>`).join('');
        if(!probe.body){ MSG.textContent = 'No se pudo cargar CSV desde ninguna ruta.'; return; }
        const text = probe.body;
        const url = probe.url;
        const datos = parseCSV(text);
        if(!datos.length){ MSG.textContent = 'CSV sin filas válidas. Encabezados esperados: Municipio, Año, Población.'; return; }
        DANE = datos;
        document.getElementById('btnDescargar').href = url;
        indexDane();
        renderTabla();
        document.getElementById('selCapa').value='municipios';
        await cargarCapa('municipios');
        MSG.textContent = `Registros cargados: ${DANE.length.toLocaleString('es-CO')}`;
      }catch(e){ MSG.textContent = 'Error cargando CSV: ' + (e.message||e); }
    })();
  </script>
</body>
</html>
